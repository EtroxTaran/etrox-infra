# Invarianten-Allowlist / Stale-Scope — owner + ISO-Ablauf Pflicht.
# Quelle: Leah BRIEF Q2 2026-09-28 (Riker adjudicated) · SRE toil / Dependabot snooze pattern.
#
# - allowlist: unterdrückt passende Verstöße bis expiry (danach wieder NEU / Delta).
# - stale: bekannte Soll-Drift (Visibility o.ä.); gleiches Matching, eigene Semantik.
# - match: kind (+ optional repo). Ohne repo = alle Repos für diesen kind.
# - Expired Einträge werden ignoriert (drop) → Violation resurfaced.
#
# verify-invariants.sh liest diese Datei. Agent darf Einträge mit Begründung ergänzen;
# expiry nie ohne Review verlängern (Geordi/Nico).

