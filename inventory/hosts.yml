---
# Inventory für AI-Server Provisioning
# 3 Hosts: ai_server (target), hetzner (public edge), r2d2 (legacy/migration source)
#
# Tailnet: example-net.ts.net
# Tailscale-IPs sind die Source-of-Truth für Inter-Host-Kommunikation;
# lokale IPs nur für Bootstrap-Phasen wo Tailscale noch nicht aktiv ist.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'

  children:
    ai_server:
      hosts:
        ai-server:
          # Während Phase 0/1 (vor Tailscale-Join): localhost via 'ansible-playbook -c local'
          # Nach Tailscale-Join: setze ansible_host auf die Tailscale-IP per host_vars/ai-server.yml
          ansible_host: 127.0.0.1
          ansible_connection: local
          ansible_user: nico       # Erst-User der Ubuntu-Desktop-Installation (uid 1000)

    hetzner:
      hosts:
        etrox-hetzner:
          ansible_host: 100.64.0.10    # tailscale-ip von 'etrox' (public-edge)
          ansible_user: "{{ hetzner_admin_user | default('root') }}"
          ansible_become: true

    r2d2:
      hosts:
        r2d2:
          # Lokales LAN ist schneller für rsync; Tailscale-IP 100.64.0.20 als Fallback
          ansible_host: 192.168.1.12
          ansible_user: clawd
          # R2D2 ist read-only — wird nur für Discovery + rsync-source benutzt.
          ansible_become: false
          r2d2_mode: read-only
