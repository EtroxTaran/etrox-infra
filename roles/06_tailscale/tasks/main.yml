---
# 06_tailscale — Tailscale up + Subnet-Router + IP-Forwarding

- name: Tailscale binary present (installed by bootstrap.sh, but double-check)
  ansible.builtin.command: which tailscale
  changed_when: false

- name: Enable IP forwarding (subnet routing)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    reload: true
    state: present
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Detect docker bridge subnet
  ansible.builtin.shell: |
    docker network inspect bridge --format '{{ "{{" }}range .IPAM.Config{{ "}}" }}{{ "{{" }}.Subnet{{ "}}" }}{{ "{{" }}end{{ "}}" }}'
  register: docker_subnet
  changed_when: false

- name: Build advertise-routes list
  ansible.builtin.set_fact:
    advertise_routes_list: "{{ ai_server_advertise_routes + [docker_subnet.stdout] | join(',') }}"

- name: Check Tailscale current state
  ansible.builtin.command: tailscale status --json
  register: ts_state
  changed_when: false
  failed_when: false

- name: Tailscale up (subnet router, ssh, with auth key)
  ansible.builtin.command: >-
    tailscale up
    --authkey={{ vault_tailscale_authkey }}
    --advertise-routes={{ advertise_routes_list }}
    --advertise-tags=tag:{{ ai_server_tag }}
    --hostname={{ target_hostname }}
    --accept-routes
    --ssh
    --reset
  when: >
    ts_state.rc != 0 or
    (ts_state.stdout | from_json).BackendState != "Running"
  no_log: true
  register: ts_up

- name: Read Tailscale IP
  ansible.builtin.command: tailscale ip -4
  register: ts_ip
  changed_when: false

- name: Persist Tailscale IP into inventory host_vars
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../inventory/host_vars/ai-server.yml"
    content: |
      ---
      # Auto-generated by role 06_tailscale
      ai_server_tailnet_ip: "{{ ts_ip.stdout_lines[0] }}"
      n8n_listen_address: "{{ ts_ip.stdout_lines[0] }}"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Print Tailscale-IP
  ansible.builtin.debug:
    msg: "Tailscale IP: {{ ts_ip.stdout_lines[0] }} — bitte im Tailscale-Admin die advertised routes approven."
