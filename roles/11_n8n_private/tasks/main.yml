---
# 11_n8n_private — n8n-private auf AI-Server. Tailscale-only listen.

- name: Ensure n8n directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1002"
    group: "1002"
    mode: "0750"
  loop:
    - "{{ n8n_data_dir }}"
    - /opt/n8n/workflows-import

- name: Render n8n compose (extends postgres compose)
  ansible.builtin.template:
    src: docker-compose.private.yml.j2
    dest: /opt/n8n/docker-compose.yml
    mode: "0644"

- name: Render n8n .env
  ansible.builtin.template:
    src: n8n-private.env.j2
    dest: /opt/n8n/.env
    mode: "0600"
    owner: "1002"
    group: "1002"
  no_log: true

- name: Copy bundled workflow templates
  ansible.builtin.copy:
    src: "workflows/"
    dest: "/opt/n8n/workflows-import/"
    mode: "0644"

- name: Start n8n-private
  community.docker.docker_compose_v2:
    project_src: /opt/n8n
    state: present

- name: Wait for n8n /healthz
  ansible.builtin.uri:
    url: "http://localhost:{{ n8n_port }}/healthz"
    status_code: 200
  register: n8n_ready
  retries: 30
  delay: 3
  until: n8n_ready.status == 200

- name: Import workflow templates (idempotent — skipped if same name exists)
  ansible.builtin.command: >-
    docker exec n8n-private n8n import:workflow
      --input=/workflows-import/{{ item }}
      --separate
  loop:
    - telegram-incoming-router.json
    - system-health-daily.json
    - discord-ci-bridge.json
  register: wf_import
  changed_when: "'Successfully imported' in wf_import.stdout"
  failed_when: false   # Re-import von existing workflow ist OK
