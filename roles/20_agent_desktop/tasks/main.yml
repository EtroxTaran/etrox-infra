---
# 20_agent_desktop — ISOLIERTE headless Browser-Session für die Agenten (agent, uid 1001).
# Eigener virtueller Display (:99 via Xvfb), eigenes persistentes Chrome-Profil mit CDP,
# per VNC einsehbar — komplett getrennt von den menschlichen KDE-Sessions (nico, sabine).
# Hermes/Playwright/computer-use docken über den CDP-Port an. Siehe docs/AGENT-BROWSER.md.

- name: Install virtual display + VNC stack
  ansible.builtin.apt:
    name:
      - xvfb                 # virtueller X-Server :99
      - x11vnc               # zum Zuschauen
      - fonts-liberation
      - libnss3
      - x11-utils
    state: present
    update_cache: true

# Browser: google-chrome-stable (echte .deb aus Google-Repo), NICHT der
# chromium-browser-Snap. Recherche: der Snap-Wrapper bricht unter systemd/Xvfb
# mit eigenem --user-data-dir (Confinement); die .deb ist für einen 24/7-CDP-
# Dienst die zuverlässige Wahl. Siehe docs/AGENT-BROWSER.md.
- name: Ensure apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Google Chrome apt signing key
  ansible.builtin.get_url:
    url: https://dl-ssl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google.asc
    mode: "0644"

- name: Add Google Chrome apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/google-chrome.list
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/linux/chrome/deb/ stable main

- name: Install google-chrome-stable
  ansible.builtin.apt:
    name: google-chrome-stable
    state: present
    update_cache: true

- name: Ensure agent chrome profile dir (persistent, auf /data)
  ansible.builtin.file:
    path: /data/agent/chrome
    state: directory
    owner: "{{ agent_user | default('agent') }}"
    group: "{{ agent_user | default('agent') }}"
    mode: "0700"

- name: Install Xvfb systemd service (display :99)
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-xvfb.service
    mode: "0644"
    content: |
      # Auto-generated by ansible role 20_agent_desktop
      [Unit]
      Description=Agent virtual display (Xvfb :99)
      After=network.target

      [Service]
      User={{ agent_user | default('agent') }}
      Group={{ agent_user | default('agent') }}
      ExecStart=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Install agent Chrome (headed, CDP) systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-chrome.service
    mode: "0644"
    content: |
      # Auto-generated by ansible role 20_agent_desktop
      [Unit]
      Description=Agent headed Chrome with CDP on :99
      After=agent-xvfb.service
      Requires=agent-xvfb.service

      [Service]
      User={{ agent_user | default('agent') }}
      Group={{ agent_user | default('agent') }}
      Environment=DISPLAY=:99
      # CDP NUR auf localhost — Zugriff für Agenten/Tools lokal bzw. via Tailscale-Proxy.
      # google-chrome-stable als non-root 'agent' → Sandbox bleibt AN (kein --no-sandbox).
      # --disable-gpu + --disable-dev-shm-usage für Stabilität unter Xvfb.
      ExecStart={{ agent_chrome_bin | default('/usr/bin/google-chrome-stable') }} \
        --user-data-dir=/data/agent/chrome \
        --remote-debugging-port={{ agent_cdp_port | default(9222) }} \
        --remote-debugging-address=127.0.0.1 \
        --no-first-run --no-default-browser-check \
        --disable-gpu --disable-dev-shm-usage \
        --disable-features=Translate \
        --start-maximized
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Install agent VNC service (read-only viewer, localhost)
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-vnc.service
    mode: "0644"
    content: |
      # Auto-generated by ansible role 20_agent_desktop
      [Unit]
      Description=Agent session VNC (view-only) on :99
      After=agent-xvfb.service
      Requires=agent-xvfb.service

      [Service]
      User={{ agent_user | default('agent') }}
      Group={{ agent_user | default('agent') }}
      # Nur localhost gebunden — Zugriff über SSH-/Tailscale-Tunnel.
      ExecStart=/usr/bin/x11vnc -display :99 -localhost -forever -shared -nopw -rfbport {{ agent_vnc_port | default(5900) }}
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Flush handlers (units müssen vor enable/start existieren)
  ansible.builtin.meta: flush_handlers

- name: Enable + start agent desktop services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - agent-xvfb.service
    - agent-chrome.service
    - agent-vnc.service

- name: Agent-desktop summary
  ansible.builtin.debug:
    msg:
      - "✅ Isolierte Agent-Session aktiv: Xvfb :99 + Chrome (CDP localhost:{{ agent_cdp_port | default(9222) }})."
      - "Profil persistent: /data/agent/chrome (eingeloggte Sessions bleiben)."
      - "Zuschauen: ssh -L {{ agent_vnc_port | default(5900) }}:localhost:{{ agent_vnc_port | default(5900) }} … + VNC-Viewer."
      - "Getrennt von den KDE-Sessions von {{ human_users | join(', ') }}."
