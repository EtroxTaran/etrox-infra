---
# 13_github_runner — GitHub Self-Hosted Runner als devrunner-User.
# Default: EPHEMERAL mit Respawn-Loop (jeder Job in frischem Runner-Kontext → kein
# persistenter Backdoor). Siehe docs/CI-LOCAL.md.

- name: Ensure runner home dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: devrunner
    group: devrunner
    mode: "0755"
  loop:
    - /home/devrunner/actions-runner
    - /data/builds/npm-cache
    - /data/builds/npm-global

- name: Render .npmrc on /data
  ansible.builtin.copy:
    dest: /home/devrunner/.npmrc
    owner: devrunner
    group: devrunner
    mode: "0644"
    content: |
      cache=/data/builds/npm-cache
      prefix=/data/builds/npm-global
      maxsockets=4

- name: Detect installed runner version
  ansible.builtin.stat:
    path: /home/devrunner/actions-runner/run.sh
  register: runner_installed

- name: Download runner if missing
  ansible.builtin.shell: |
    set -e
    cd /home/devrunner/actions-runner
    LATEST=$(curl -s https://api.github.com/repos/actions/runner/releases/latest \
                 | jq -r .tag_name | sed 's/v//')
    curl -fsSL "https://github.com/actions/runner/releases/download/v${LATEST}/actions-runner-linux-x64-${LATEST}.tar.gz" \
        | tar xz
    echo "Downloaded runner v${LATEST}"
  when: not runner_installed.stat.exists
  become_user: devrunner

# ============================ EPHEMERAL (Default) ============================
# Respawn-Loop: holt pro Job einen frischen JIT-Registration-Token, konfiguriert
# den Runner --ephemeral, läuft genau einen Job, räumt die lokale Config weg und
# registriert sich neu. So bleibt jeder Job isoliert, ohne dass ein dauerhaft
# registrierter Runner als Backdoor offensteht.

- name: Store PAT for devrunner (zum Minten von JIT-Registration-Tokens)
  ansible.builtin.copy:
    dest: /home/devrunner/.runner-pat
    owner: devrunner
    group: devrunner
    mode: "0600"
    content: "{{ vault_github.pat_token }}"
  when: github_runner_ephemeral | default(true) | bool
  no_log: true
  # Hinweis: Der PAT liegt 0600 beim devrunner — der kann ohnehin Runner registrieren.
  # Für höhere Isolation: fine-grained PAT NUR mit 'self-hosted runners: write' nutzen.

- name: Install ephemeral respawn loop script
  ansible.builtin.copy:
    dest: /home/devrunner/actions-runner/run-ephemeral.sh
    owner: devrunner
    group: devrunner
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Auto-generated by ansible role 13_github_runner — ephemeral respawn loop.
      set -uo pipefail
      cd /home/devrunner/actions-runner
      ORG="{{ vault_github.org }}"
      GROUP="{{ github_runner_group | default('ai-server-trusted') }}"
      LABELS="self-hosted,linux,x64,gpu,ai-server,claude-code"
      while true; do
        TOKEN=$(GITHUB_TOKEN="$(cat /home/devrunner/.runner-pat)" gh api -X POST \
                  "/orgs/${ORG}/actions/runners/registration-token" -q .token) || {
          echo "[runner] registration-token fetch failed, retry in 30s"; sleep 30; continue; }
        ./config.sh --unattended --replace \
          --url "https://github.com/${ORG}" \
          --token "${TOKEN}" \
          --name "{{ target_hostname }}-devrunner-$(date +%s)" \
          --runnergroup "${GROUP}" \
          --labels "${LABELS}" \
          --ephemeral --work _work || { echo "[runner] config failed, retry in 30s"; sleep 30; continue; }
        ./run.sh || true
        # ephemeral: GitHub entfernt den Runner serverseitig nach dem Job; lokale Reste weg.
        rm -f .runner .credentials .credentials_rsaparams || true
        sleep 2
      done
  when: github_runner_ephemeral | default(true) | bool

- name: Install ephemeral runner systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/github-runner-ephemeral.service
    mode: "0644"
    content: |
      # Auto-generated by ansible role 13_github_runner
      [Unit]
      Description=GitHub ephemeral self-hosted runner (respawn loop)
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=devrunner
      Group=devrunner
      WorkingDirectory=/home/devrunner/actions-runner
      ExecStart=/home/devrunner/actions-runner/run-ephemeral.sh
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  when: github_runner_ephemeral | default(true) | bool

- name: Enable + start ephemeral runner service
  ansible.builtin.systemd:
    name: github-runner-ephemeral.service
    daemon_reload: true
    enabled: true
    state: started
  when: github_runner_ephemeral | default(true) | bool

# ============================ LEGACY (persistent) ===========================
# Fallback: klassischer dauerhaft registrierter Runner (github_runner_ephemeral=false).
- name: (legacy) Get runner registration token via gh
  ansible.builtin.shell: |
    GITHUB_TOKEN={{ vault_github.pat_token }} gh api \
      -X POST \
      /orgs/{{ vault_github.org }}/actions/runners/registration-token \
      -q .token
  register: runner_token
  changed_when: false
  when:
    - not (github_runner_ephemeral | default(true) | bool)
    - not runner_installed.stat.exists
  no_log: true

- name: (legacy) Configure persistent runner
  ansible.builtin.shell: |
    cd /home/devrunner/actions-runner
    ./config.sh --unattended \
      --url https://github.com/{{ vault_github.org }} \
      --token {{ runner_token.stdout }} \
      --name {{ target_hostname }}-devrunner \
      --runnergroup "{{ github_runner_group | default('ai-server-trusted') }}" \
      --labels self-hosted,linux,x64,gpu,ai-server,claude-code \
      --work _work
  when:
    - not (github_runner_ephemeral | default(true) | bool)
    - not runner_installed.stat.exists
  become_user: devrunner
  no_log: true

- name: (legacy) Install runner systemd unit via svc.sh
  ansible.builtin.shell: |
    cd /home/devrunner/actions-runner
    ./svc.sh install devrunner
    ./svc.sh start
  args:
    creates: /etc/systemd/system/actions.runner.{{ vault_github.org }}.{{ target_hostname }}-devrunner.service
  when: not (github_runner_ephemeral | default(true) | bool)
