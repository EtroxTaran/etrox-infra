---
# 14_davinci_prep — NUR Pre-Reqs für DaVinci Resolve Studio.
# Resolve selbst muss per Hand installiert werden (Lizenz-Login).
# Doku: docs/DAY-2-OPERATIONS.md §DaVinci

- name: Install Python 3.12 (NICHT 3.13 — fusionscript ABI)
  ansible.builtin.apt:
    name:
      - python3.12
      - python3.12-venv
      - python3-pip
    state: present
    update_cache: true

- name: Install media stack dependencies
  ansible.builtin.apt:
    name:
      - libssl-dev
      - libgtk-3-0
      - libxkbcommon0
      - libnss3
      - libxcb-randr0
      - libxcb-xtest0
      - libxcb-xinerama0
      - ffmpeg
      - mediainfo
    state: present

- name: Ensure davinci scratch + media dirs (auf schneller /data-NVMe)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: davinci
    group: davinci
    mode: "2775"        # setgid → menschliche Editoren (Gruppe) können mitschreiben
  loop:
    - "{{ davinci_scratch }}"
    - "{{ davinci_media | default('/data/davinci/media') }}"

# --- GLib-Fix: Resolve bündelt eigene libglib/libgio/libgmodule, die auf
# Ubuntu 24.04 mit der System-GLib kollidieren → Resolve startet nicht.
# Lösung: gebündelte Libs wegmoven, damit die System-GLib genutzt wird.
# Läuft nur, wenn Resolve bereits installiert ist (idempotent).
- name: Check if DaVinci Resolve is installed
  ansible.builtin.stat:
    path: /opt/resolve/libs
  register: resolve_libs

- name: Move bundled GLib libs out of the way (Ubuntu 24.04 start-fix)
  ansible.builtin.shell: |
    set -e
    cd /opt/resolve/libs
    mkdir -p unneeded
    moved=0
    for pat in 'libglib-2.0.so*' 'libgio-2.0.so*' 'libgmodule-2.0.so*'; do
      for f in $pat; do
        if [[ -e "$f" && ! -L "$f" ]]; then
          mv -f "$f" unneeded/ && moved=1
        fi
      done
    done
    [[ $moved -eq 1 ]] && echo CHANGED || echo NOOP
  register: glib_fix
  changed_when: "'CHANGED' in glib_fix.stdout"
  when: resolve_libs.stat.exists

# --- NVENC-Transkodier-Helper: Resolve liefert auf Linux KEIN brauchbares
# H.264/H.265-Delivery → finale Renders extern mit ffmpeg NVENC transkodieren.
- name: Install ffmpeg NVENC transcode helper
  ansible.builtin.copy:
    dest: /usr/local/bin/resolve-transcode
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # resolve-transcode <input> [h264|h265] [output]
      # H.264/H.265-Delivery via NVIDIA NVENC, weil DaVinci Resolve auf Linux
      # diese Codecs nicht selbst rendert. Siehe docs/DAY-2-OPERATIONS.md.
      set -euo pipefail
      in="${1:?usage: resolve-transcode <input> [h264|h265] [output]}"
      codec="${2:-h265}"
      case "$codec" in
        h264) enc=h264_nvenc ;;
        h265|hevc) enc=hevc_nvenc ;;
        *) echo "codec muss h264 oder h265 sein" >&2; exit 2 ;;
      esac
      out="${3:-${in%.*}.${codec}.mp4}"
      exec ffmpeg -i "$in" -c:v "$enc" -preset p5 -rc vbr -cq 19 \
                  -c:a aac -b:a 320k "$out"

- name: Set DaVinci ENV vars in davinci's .bashrc
  ansible.builtin.blockinfile:
    path: /home/davinci/.bashrc
    create: true
    owner: davinci
    group: davinci
    mode: "0644"
    block: |
      # DaVinci Resolve Python API (auto-generated by ansible)
      export RESOLVE_SCRIPT_API="/opt/resolve/Developer/Scripting/"
      export RESOLVE_SCRIPT_LIB="/opt/resolve/libs/Fusion/fusionscript.so"
      export PYTHONPATH="${PYTHONPATH:-}:${RESOLVE_SCRIPT_API}/Modules/"
    marker: "# {mark} ANSIBLE MANAGED davinci env"

- name: Print manual install hint
  ansible.builtin.debug:
    msg: |
      ⚠️ DaVinci Resolve Studio Installation muss manuell durchgeführt werden:
        1. https://www.blackmagicdesign.com/products/davinciresolve  → Studio (.run / .deb)
        2. sudo dpkg -i DaVinci_Resolve_Studio_*.deb
        3. /opt/resolve/installer  (folgt der CLI-Wizard, Lizenz-Login interaktiv)
        4. Test: sudo -u davinci /opt/resolve/bin/resolve --version
