---
# 21_gpu_arbiter — VRAM-Arbitrierung auf der 12-GB-RTX-4070-Ti.
# Ollama, DaVinci Resolve und Civ 7 teilen sich die GPU. Schwere GPU-Last
# (Gaming/Render) verträgt sich nicht mit einem residenten LLM → wir geben
# VRAM frei, indem 'gpu-heavy.target' den ollama.service per Conflicts stoppt.
# Siehe docs/GAMING.md und docs/DAY-2-OPERATIONS.md.

- name: Install gpu-heavy.target (Conflicts=ollama.service)
  ansible.builtin.copy:
    dest: /etc/systemd/system/gpu-heavy.target
    mode: "0644"
    content: |
      # Auto-generated by ansible role 21_gpu_arbiter
      [Unit]
      Description=GPU-heavy workload (Gaming/DaVinci) — frees VRAM by stopping Ollama
      {% if gpu_heavy_stops_ollama | default(true) %}
      Conflicts=ollama.service
      After=ollama.service
      {% endif %}
  notify: reload systemd

- name: Flush handlers (target muss vor Skript-Nutzung existieren)
  ansible.builtin.meta: flush_handlers

- name: Install gpu-heavy wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/gpu-heavy
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # gpu-heavy {on|off|status|run -- <cmd...>}
      # on  → stoppt Ollama (via gpu-heavy.target), wartet bis VRAM frei
      # off → fährt Ollama wieder hoch
      # run → on; führt <cmd> aus; off (auch bei Fehler)
      set -euo pipefail
      free_vram() {
        nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader || true
      }
      on() {
        echo "[gpu-heavy] stoppe GPU-Hintergrundlast (Ollama) ..."
        sudo systemctl start gpu-heavy.target
        for i in $(seq 1 15); do
          used=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -1)
          echo "[gpu-heavy] VRAM used: ${used} MiB"
          [[ "${used}" -lt 1500 ]] && break
          sleep 1
        done
      }
      off() {
        echo "[gpu-heavy] gebe GPU wieder für Ollama frei ..."
        sudo systemctl stop gpu-heavy.target || true
        sudo systemctl start ollama.service || true
      }
      case "${1:-status}" in
        on) on ;;
        off) off ;;
        status) echo "VRAM: $(free_vram)"; systemctl is-active ollama.service || true ;;
        run) shift; [[ "${1:-}" == "--" ]] && shift; trap off EXIT; on; "$@" ;;
        *) echo "usage: gpu-heavy {on|off|status|run -- <cmd...>}" >&2; exit 2 ;;
      esac

# sudo ohne Passwort NUR für die zwei systemctl-Aktionen (menschliche Gamer
# sind nicht in sudo). Eng begrenzt auf gpu-heavy.target + ollama.service.
- name: Allow human users to toggle gpu-heavy.target without full sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gpu-heavy
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Auto-generated by ansible role 21_gpu_arbiter
      Cmnd_Alias GPU_HEAVY = /usr/bin/systemctl start gpu-heavy.target, \
                             /usr/bin/systemctl stop gpu-heavy.target, \
                             /usr/bin/systemctl start ollama.service, \
                             /usr/bin/systemctl stop ollama.service
      %games ALL=(root) NOPASSWD: GPU_HEAVY

- name: Install KDE launchers (Gaming-Mode / Resolve mit freier GPU)
  ansible.builtin.copy:
    dest: "/usr/share/applications/{{ item.file }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name={{ item.name }}
      Comment={{ item.comment }}
      Exec={{ item.exec }}
      Icon={{ item.icon }}
      Terminal=false
      Categories={{ item.cat }}
  loop:
    - file: gpu-heavy-on.desktop
      name: "GPU für Spiele/Render freigeben"
      comment: "Stoppt Ollama, gibt VRAM frei"
      exec: "gpu-heavy on"
      icon: applications-games
      cat: "System;"
    - file: resolve-gpu.desktop
      name: "DaVinci Resolve (GPU frei)"
      comment: "Gibt VRAM frei und startet Resolve"
      exec: "gpu-heavy run -- /opt/resolve/bin/resolve"
      icon: davinci-resolve
      cat: "AudioVideo;"

- name: GPU-arbiter summary
  ansible.builtin.debug:
    msg:
      - "✅ gpu-heavy.target + /usr/local/bin/gpu-heavy installiert."
      - "Gamer (Gruppe games) können Ollama ohne sudo pausieren."
      - "Nutzung: 'gpu-heavy on' vor Civ7/Render, 'gpu-heavy off' danach (oder 'gpu-heavy run -- <cmd>')."
