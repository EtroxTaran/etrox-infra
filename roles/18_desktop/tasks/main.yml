---
# 18_desktop — KDE Plasma Desktop für die menschlichen User (nico, sabine).
# Wayland als Default-Session (mit NVIDIA-Desktop-Treiber aus roles/04_nvidia_cuda),
# X11-Session bleibt als Fallback wählbar. Service-User loggen sich NICHT grafisch ein.
# Siehe docs/HARDWARE-B850F.md.

# Ubuntu Desktop bringt GNOME + gdm3 mit. Beim SDDM-Install fragt dpkg sonst
# interaktiv nach dem Default-Display-Manager → vorher per debconf festlegen.
- name: Preseed default display manager = sddm (verhindert dpkg-Prompt)
  ansible.builtin.shell: |
    echo 'sddm shared/default-x-display-manager select sddm' | debconf-set-selections
    echo 'gdm3 shared/default-x-display-manager select sddm' | debconf-set-selections
  changed_when: false

- name: Install KDE Plasma + SDDM + Wayland session
  ansible.builtin.apt:
    name:
      - kde-plasma-desktop
      - sddm                          # Display-Manager
      - plasma-workspace-wayland      # Wayland-Session
      - kwin-wayland
      - plasma-nm                     # NetworkManager-Applet
      - plasma-pa                     # Audio-Applet
      - dolphin                       # Dateimanager
      - konsole                       # Terminal
      - kate
      - breeze
    state: present
    update_cache: true

- name: Install PipeWire audio stack
  ansible.builtin.apt:
    name:
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - libspa-0.2-bluetooth
    state: present

- name: Install Flatpak + KDE Discover backend
  ansible.builtin.apt:
    name:
      - flatpak
      - plasma-discover-backend-flatpak
      - fonts-noto
      - fonts-noto-color-emoji
    state: present

- name: Add Flathub remote (system-wide)
  ansible.builtin.command: >-
    flatpak remote-add --if-not-exists flathub
    https://flathub.org/repo/flathub.flatpakrepo
  register: flathub
  changed_when: "'already exists' not in flathub.stderr | default('')"

- name: Disable gdm3 (Ubuntu-Desktop-Default) zugunsten SDDM
  ansible.builtin.systemd:
    name: gdm3
    enabled: false
  failed_when: false   # gdm3 evtl. nicht vorhanden (z.B. Server-Install)

- name: Set sddm as system default display manager
  ansible.builtin.copy:
    dest: /etc/X11/default-display-manager
    content: "/usr/bin/sddm\n"
    mode: "0644"

- name: Enable SDDM display manager
  ansible.builtin.systemd:
    name: sddm
    enabled: true

- name: Set graphical.target as default boot target
  ansible.builtin.command: systemctl set-default graphical.target
  register: set_target
  changed_when: "'Created symlink' in set_target.stderr | default('') or 'Removed' in set_target.stderr | default('')"

# Wayland als Default-Session für SDDM; X11 bleibt im Login-Menü wählbar.
- name: Configure SDDM to default to the Plasma Wayland session
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/10-wayland.conf
    mode: "0644"
    content: |
      # Auto-generated by ansible role 18_desktop
      [General]
      DisplayServer=wayland
      [Wayland]
      Enable=true
      SessionDir=/usr/share/wayland-sessions

- name: Enable PipeWire globally for all (human) user sessions
  ansible.builtin.command: "systemctl --global enable {{ item }}"
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service
  register: pw_enable
  changed_when: "'Created symlink' in pw_enable.stderr | default('')"
  failed_when: false   # auf 24.04-Desktop oft schon Default-aktiv

- name: Desktop summary
  ansible.builtin.debug:
    msg:
      - "✅ KDE Plasma installiert. Display-Manager: SDDM (Wayland default, X11 wählbar)."
      - "Menschliche User mit Login: {{ human_users | join(', ') }}"
      - "Nach Reboot erscheint der grafische SDDM-Login."
